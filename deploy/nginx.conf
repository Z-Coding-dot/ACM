map $uri $acm_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/(api/|sanctum/|auth/google/|email/verify/|up$|health/) "no-store, private";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $acm_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location ~ ^/(api/|sanctum/|auth/google/|email/verify/|up$|health/) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/acm/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        # OAuth codes and signed/reset tokens must not enter access logs.
        access_log off;
    }
    location ~ /\. { deny all; }
    location /assets/ { try_files $uri =404; }
    location = /sw.js { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
