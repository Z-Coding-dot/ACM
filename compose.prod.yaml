name: acm
x-app-environment: &app-environment
  APP_NAME: ACM
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Set a private Laravel application key}
  APP_URL: ${PUBLIC_ORIGIN:?Set the real HTTPS origin}
  FRONTEND_URL: ${PUBLIC_ORIGIN}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: acm
  DB_USERNAME: acm
  DB_PASSWORD: ${DB_PASSWORD:?Set a private database password}
  SESSION_DRIVER: database
  SESSION_COOKIE: acm_session
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "true"
  SESSION_HTTP_ONLY: "true"
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: lax
  SESSION_DOMAIN: null
  SANCTUM_STATEFUL_DOMAINS: ${ACM_DOMAIN:?Set the real public DNS name}
  CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  MAIL_MAILER: smtp
  MAIL_HOST: ${MAIL_HOST:?Configure a real SMTP relay}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?Set the verified sender address}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ACM}
  MAIL_TIMEOUT: ${MAIL_TIMEOUT:-5}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${PUBLIC_ORIGIN}/auth/google/callback
  ACM_BUSINESSES_PER_USER: ${ACM_BUSINESSES_PER_USER:-}
  ACM_CUSTOMERS_PER_BUSINESS: ${ACM_CUSTOMERS_PER_BUSINESS:-}
  ACM_SERVICES_PER_BUSINESS: ${ACM_SERVICES_PER_BUSINESS:-}
  ACM_STAFF_PER_BUSINESS: ${ACM_STAFF_PER_BUSINESS:-}
services:
  migrate:
    image: acm-backend:${ACM_VERSION:-local}
    profiles: [tools]
    environment:
      <<: *app-environment
      DB_USERNAME: acm_migrate
      DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set a separate private migration password}
    entrypoint: ["php", "artisan"]
    command: ["migrate", "--force"]
    depends_on: { mysql: { condition: service_healthy } }
  app:
    image: acm-backend:${ACM_VERSION:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment: *app-environment
    volumes: [app_storage:/var/www/acm/storage]
    depends_on:
      mysql: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "acm:health"]
      interval: 30s
      timeout: 10s
      retries: 3
  scheduler:
    image: acm-backend:${ACM_VERSION:-local}
    environment: *app-environment
    command: ["php", "artisan", "schedule:work"]
    volumes: [app_storage:/var/www/acm/storage]
    depends_on: { app: { condition: service_healthy } }
    restart: unless-stopped
  web:
    image: acm-frontend:${ACM_VERSION:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_GOOGLE_AUTH_URL: ${PUBLIC_ORIGIN}/auth/google/redirect
    depends_on: { app: { condition: service_healthy } }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 10s
      retries: 3
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: acm
      MYSQL_USER: acm
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate private root password}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD}
    volumes: ["mysql_data:/var/lib/mysql", "./deploy/mysql-init.sh:/docker-entrypoint-initdb.d/10-acm-permissions.sh:ro"]
    # No host database port; only the private Docker network can reach MySQL.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --user=$$MYSQL_USER $$MYSQL_DATABASE --execute='SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  https:
    image: caddy:2-alpine
    environment: { ACM_DOMAIN: "${ACM_DOMAIN}" }
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: { web: { condition: service_healthy } }
    restart: unless-stopped
volumes:
  mysql_data:
  app_storage:
  caddy_data:
  caddy_config:
