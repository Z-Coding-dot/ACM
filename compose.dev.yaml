name: acm-dev
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: acm
      MYSQL_USER: acm
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run the local backend setup first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run the local backend setup first}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --user=$$MYSQL_USER $$MYSQL_DATABASE --execute='SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
volumes:
  mysql_data:
